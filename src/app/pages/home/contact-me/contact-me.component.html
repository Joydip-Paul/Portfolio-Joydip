<section class="contact pb-100">
  <div class="container">
    <div class="title-area">
      <div class="eyebrow"><span></span> Start a conversation</div>
      <h2>
        Love to hear from you,<br />
        Get in touch
      </h2>
      <p>Have an idea, a question, or a project in mind? Send a message and I'll get back to you soon.</p>
    </div>

    <form
      class="contact-form"
      [formGroup]="contactForm"
      (ngSubmit)="onSubmit(contactForm.value)"
    >
      <div class="inp-flex">
        <div class="contact-form__each">
          <label>Your Name</label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter first name"
            formControlName="name"
            [ngClass]="{
              'is-invalid': submitted && contactForm.controls.name.errors
            }"
          />
          <div
            *ngIf="submitted && contactForm.controls.name.errors"
            class="error-text"
          >
            Name is required
          </div>
        </div>
        <div class="contact-form__each">
          <label>Email address</label>
          <input
            type="email"
            class="form-control"
            placeholder="Enter email"
            formControlName="email"
            [ngClass]="{
              'is-invalid': submitted && contactForm.controls.email.errors
            }"
          />
          <div
            *ngIf="submitted && contactForm.controls.email.errors"
            class="error-text"
          >
            Email is required
          </div>
        </div>
      </div>
      <div class="contact-form__each">
        <label>Your Message</label>
        <textarea
          class="form-control"
          id="exampleFormControlTextarea1"
          placeholder="Your message"
          rows="6"
          formControlName="message"
          [ngClass]="{
            'is-invalid': submitted && contactForm.controls.message.errors
          }"
        ></textarea>
        <div
          *ngIf="submitted && contactForm.controls.message.errors"
          class="error-text"
        >
          Message is required
        </div>
      </div>
      <div class="submit-btn">
        <button type="submit" class="main-btn">
          Send on WhatsApp <i class="fa-brands fa-whatsapp"></i>
        </button>
        <!-- *ngIf="isSuccess" -->
        <div class="success-message" [ngClass]="{ active: isSuccess }">
          <div class="icon">
            <i class="fa-solid fa-check"></i>
          </div>
          <div class="content">
            <h2>Hey, {{ this.username }}</h2>
            <p>Your message is ready in WhatsApp.</p>
          </div>
        </div>
      </div>
    </form>
  </div>
</section>
